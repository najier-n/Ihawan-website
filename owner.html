<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | 'Ihawan Filipino Grill</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@400;700&family=Playfair+Display:wght@700;900&display=swap');

        :root {
            --fire: #F5A800;
            --ember: #E05A00;
            --char: #0F0A05;
            --smoke: #1E1408;
            --cream: #FDF3E3;
            --ready: #22C55E;
            --preparing: #F5A800;
            --received: #94a3b8;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--char); color: var(--cream); font-family: 'Lato', sans-serif; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .label, .btn { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.1em; }

        /* Login */
        #loginOverlay { position: fixed; inset: 0; background: var(--char); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-box { width: 400px; background: var(--smoke); padding: 40px; border: 1px solid var(--fire); text-align: center; }
        .login-box h1 { color: var(--fire); margin-bottom: 30px; }
        .error { color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        /* Dashboard */
        #dashboard { display: none; padding: 30px; max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--smoke); padding-bottom: 20px; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--smoke); padding: 25px; border-left: 4px solid var(--fire); }
        .stat-val { font-size: 2.5rem; color: var(--fire); font-family: 'Bebas Neue'; }
        .stat-label { font-size: 0.9rem; color: var(--muted); text-transform: uppercase; }

        /* Tabs */
        .tabs { display: flex; gap: 20px; margin-bottom: 30px; }
        .tab { padding: 10px 20px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
        .tab.active { color: var(--fire); border-color: var(--fire); }

        /* Orders */
        .order-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 25px; }
        .order-card { background: var(--smoke); padding: 25px; border: 1px solid #333; position: relative; }
        .order-card.new { border-color: var(--fire); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(245, 168, 0, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(245, 168, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 168, 0, 0); } }
        
        .order-id { font-family: 'Bebas Neue'; color: var(--fire); font-size: 1.2rem; margin-bottom: 15px; display: block; }
        .badge { display: inline-block; padding: 4px 10px; font-size: 0.7rem; font-family: 'Bebas Neue'; border-radius: 2px; margin-bottom: 10px; }
        .badge-received { background: rgba(148, 163, 184, 0.1); color: var(--received); }
        .badge-preparing { background: rgba(245, 168, 0, 0.1); color: var(--fire); }
        .badge-ready { background: rgba(34, 197, 94, 0.1); color: var(--ready); }

        .item-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .notes-box { background: rgba(245, 168, 0, 0.05); padding: 10px; border-left: 2px solid var(--fire); font-size: 0.85rem; margin-top: 15px; font-style: italic; }

        .btn { padding: 12px; cursor: pointer; border: none; font-size: 1rem; width: 100%; transition: 0.3s; margin-top: 20px; }
        .btn-fire { background: var(--fire); color: var(--char); }
        .btn-ready { background: var(--ready); color: white; }
        .btn-done { background: #333; color: white; }

        input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--char); border: 1px solid var(--fire); color: white; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box" id="loginBox">
            <h1 class="h-font">'Ihawan</h1>
            <p class="label" style="margin-bottom: 20px; opacity: 0.6;">Owner Dashboard</p>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="btn btn-fire label" onclick="login()">Sign In</button>
            <div id="loginError" class="error">Invalid credentials.</div>
        </div>
    </div>

    <div id="dashboard">
        <header>
            <div>
                <h1 style="color: var(--fire);">'Ihawan</h1>
                <p class="label" id="liveClock">00:00:00</p>
            </div>
            <button class="btn label" style="width: auto; padding: 10px 20px; background: #333; color: white;" onclick="logout()">Sign Out</button>
        </header>

        <div class="stats-row">
            <div class="stat-card"><div class="stat-val" id="statNew">0</div><div class="stat-label">New Orders</div></div>
            <div class="stat-card"><div class="stat-val" id="statPrep">0</div><div class="stat-label">Preparing</div></div>
            <div class="stat-card"><div class="stat-val" id="statReady">0</div><div class="stat-label">Ready</div></div>
            <div class="stat-card" onclick="openRevenueModal()" style="cursor:pointer;">
    <div class="stat-val" id="statRevenue">₱0</div>
    <div class="stat-label">Today's Revenue</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="setTab('all', this)">All Orders</div>
            <div class="tab" onclick="setTab('received', this)">New</div>
            <div class="tab" onclick="setTab('preparing', this)">Preparing</div>
            <div class="tab" onclick="setTab('ready', this)">Ready</div>
            <div class="tab" onclick="setTab('reservations', this)">Reservations</div>
        </div>

        <div id="orderGrid" class="order-list"></div>
    </div>
<!-- Revenue History Modal -->
<div id="revenueModal" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    z-index:9999;
    align-items:center;
    justify-content:center;
">

    <div style="
        background:var(--smoke);
        width:90%;
        max-width:500px;
        padding:30px;
        border:1px solid var(--fire);
        position:relative;
    ">

        <button onclick="closeRevenueModal()" style="
            position:absolute;
            top:10px;
            right:10px;
            background:none;
            border:none;
            color:white;
            font-size:1.5rem;
            cursor:pointer;
        ">✕</button>

        <h2 style="color:var(--fire); margin-bottom:25px;">
            Revenue History
        </h2>

        <div style="display:grid; gap:15px;">

            <div class="stat-card">
                <div class="stat-val" id="yesterdayRevenue">₱0</div>
                <div class="stat-label">Yesterday</div>
            </div>

            <div class="stat-card">
                <div class="stat-val" id="weeklyRevenue">₱0</div>
                <div class="stat-label">Weekly Earnings</div>
            </div>

            <div class="stat-card">
                <div class="stat-val" id="monthlyRevenue">₱0</div>
                <div class="stat-label">Monthly Earnings</div>
            </div>

        </div>

    </div>

</div>
    <script>
        let currentTab = 'all';
        let knownOrderIds = new Set();

        function openRevenueModal() {

    const orders = JSON.parse(localStorage.getItem('ihawan_orders') || '[]');

    const now = new Date();

    let yesterday = 0;
    let weekly = 0;
    let monthly = 0;

    orders.forEach(order => {

        if(order.status === 'cancelled') return;

        const orderDate = new Date(order.timestamp);

        const diffDays = Math.floor(
            (now - orderDate) / (1000 * 60 * 60 * 24)
        );

        // Yesterday
        if(diffDays === 1) {
            yesterday += order.total;
        }

        // Weekly
        if(diffDays <= 7) {
            weekly += order.total;
        }

        // Monthly
        if(
            orderDate.getMonth() === now.getMonth() &&
            orderDate.getFullYear() === now.getFullYear()
        ) {
            monthly += order.total;
        }

    });

    document.getElementById('yesterdayRevenue').innerText =
        '₱' + yesterday.toFixed(2);

    document.getElementById('weeklyRevenue').innerText =
        '₱' + weekly.toFixed(2);

    document.getElementById('monthlyRevenue').innerText =
        '₱' + monthly.toFixed(2);

    document.getElementById('revenueModal').style.display = 'flex';
}

function closeRevenueModal() {
    document.getElementById('revenueModal').style.display = 'none';
}

        function init() {
            if(sessionStorage.getItem('ihawan_auth') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                startDashboard();
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleDateString() + ' | ' + now.toLocaleTimeString();
        }

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === 'ihawan_owner' && p === 'grill2026!') {
                sessionStorage.setItem('ihawan_auth', 'true');
                location.reload();
            } else {
                const box = document.getElementById('loginBox');
                box.classList.add('shake');
                document.getElementById('loginError').style.display = 'block';
                setTimeout(() => box.classList.remove('shake'), 400);
            }
        }

        function logout() {
            sessionStorage.removeItem('ihawan_auth');
            location.reload();
        }

        function startDashboard() {
            renderOrders();
            setInterval(renderOrders, 5000);
        }

        function setTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderOrders();
        }

        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem('ihawan_orders') || '[]').reverse();
            const grid = document.getElementById('orderGrid');
            grid.innerHTML = '';

            // Handle Notifications
            orders.forEach(o => {
                if(o.status === 'received' && !knownOrderIds.has(o.id)) {
                    notify();
                    knownOrderIds.add(o.id);
                }
            });

            // Update Stats
            document.getElementById('statNew').innerText = orders.filter(o => o.status === 'received').length;
            document.getElementById('statPrep').innerText = orders.filter(o => o.status === 'preparing').length;
            document.getElementById('statReady').innerText = orders.filter(o => o.status === 'ready').length;
            const rev = orders
    .filter(o => o.status !== 'cancelled')
    .reduce((sum, o) => sum + o.total, 0);
            document.getElementById('statRevenue').innerText = '₱' + rev.toFixed(2);

            if(currentTab === 'reservations') return renderReservations();

            const filtered = orders.filter(o => currentTab === 'all' || o.status === currentTab);

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="label" style="grid-column: 1/-1; text-align: center; padding: 50px;">No orders here. 🔥 Waiting for the next one.</p>';
                return;
            }

            filtered.forEach(order => {
                const elapsed = Math.floor((Date.now() - order.timestamp) / 60000);
                const card = document.createElement('div');
                card.className = `order-card ${order.status === 'received' ? 'new' : ''}`;
                card.innerHTML = `
                    <span class="order-id">${order.id}</span>
                    <div class="badge badge-${order.status}">${order.status.toUpperCase()}</div>
                    <div style="margin-bottom:15px">

    <strong>
    ${order.customer.name}
</strong>

(${order.customer.type})

${order.customer.type === 'dine-in'
    && order.customer.tableNumber
    ? `<br>
       <span style="
            color:var(--fire);
            font-size:0.85rem;
       ">
            🍽 Table:
            <strong>
                ${order.customer.tableNumber}
            </strong>
       </span>`
    : ''
}

<br>

    <span style="
        font-size:0.8rem;
        opacity:0.7;
    ">

        ${order.customer.phone}
        |
        Placed ${elapsed}m ago

    </span>

    <div style="
        margin-top:10px;
        padding:10px;
        background:rgba(245,168,0,0.08);
        border-left:3px solid var(--fire);
        font-size:0.85rem;
    ">

        💳 Payment:
        <strong>
            ${order.payment?.method?.toUpperCase() || 'CASH'}
        </strong>

        ${
            order.payment?.method === 'gcash'
            ? `<br><br>
               📌 Reference:
               <strong>
                   ${order.payment.reference}
               </strong>`
            : ''
        }

    </div>

</div>
                    ${order.customer.type === 'delivery' ? `<div style="font-size:0.8rem; margin-bottom:15px">📍 ${order.customer.address}</div>` : ''}
                    <div class="items-list">
                        ${order.items.map(i => `<div class="item-row"><span>${i.qty}x ${i.name}</span><span>₱${i.subtotal.toFixed(2)}</span></div>`).join('')}
                    </div>
                    <div style="text-align:right; margin-top:10px; font-weight:bold; color:var(--fire)">Total: ₱${order.total.toFixed(2)}</div>
                    ${order.customer.notes ? `<div class="notes-box">" ${order.customer.notes} "</div>` : ''}
                    ${renderActions(order)}
                `;
                grid.appendChild(card);
            });
        }

        function renderActions(order) {
            if(order.status === 'received') {
                return `<button class="btn btn-fire label" onclick="updateStatus('${order.id}', 'preparing')">🔥 Start Preparing</button>`;
            }
            if(order.status === 'preparing') {
                return `<button class="btn btn-ready label" onclick="updateStatus('${order.id}', 'ready')">✅ Mark as Ready</button>
                                                     <button class="btn label" style="background:#ef4444; color:white;" onclick="cancelOrder('${order.id}')">❌ Cancel Order</button>`;
            }
            if(order.status === 'ready') {
                return `<button class="btn btn-done label" onclick="updateStatus('${order.id}', 'completed')">✔ Mark Completed</button>`;
            return '';
            }
        }

        function updateStatus(id, newStatus) {
            const orders = JSON.parse(localStorage.getItem('ihawan_orders') || '[]');
            const idx = orders.findIndex(o => o.id === id);
            if(idx !== -1) {
                orders[idx].status = newStatus;
                localStorage.setItem('ihawan_orders', JSON.stringify(orders));
                renderOrders();
            }
        }

            function cancelOrder(id) {
    if(!confirm("Are you sure you want to cancel this order?")) return;

    const orders = JSON.parse(localStorage.getItem('ihawan_orders') || '[]');
    const idx = orders.findIndex(o => o.id === id);
       if(idx !== -1) {
    orders[idx].status = 'cancelled';
}
localStorage.setItem('ihawan_orders', JSON.stringify(orders));
    renderOrders();
            }

        function renderReservations() {
            const grid = document.getElementById('orderGrid');
            const res = JSON.parse(localStorage.getItem('ihawan_reservations') || '[]');
            if(res.length === 0) { grid.innerHTML = '<p style="grid-column:1/-1; text-align:center">No reservations.</p>'; return; }
            
            res.reverse().forEach((r, i) => {
                grid.innerHTML += `
                    <div class="order-card">
                        <span class="order-id">Reservation</span>
                        <h3 style="margin-bottom:10px">${r.name}</h3>
                        <p class="label" style="color:var(--fire)">Date: ${r.date} | Time: ${r.time}</p>
                        <button class="btn label" style="background:#333; color:white" onclick="deleteRes(${i})">Clear Reservation</button>
                    </div>
                `;
            });
        }

        function deleteRes(idx) {
            const res = JSON.parse(localStorage.getItem('ihawan_reservations') || '[]');
            res.splice(idx, 1);
            localStorage.setItem('ihawan_reservations', JSON.stringify(res));
            renderOrders();
        }

        function notify() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } catch(e) {}
        }

        init();
    </script>
</body>
</html>
