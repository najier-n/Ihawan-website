<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard | 'Ihawan</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --fire: #F5A800; --char: #0F0A05; --smoke: #1E1408; --cream: #FDF3E3; --muted: rgba(253,243,227,0.5); --success: #22C55E; --danger: #EF4444; }
        body { background: var(--char); color: var(--cream); font-family: 'Lato', sans-serif; margin: 0; }
        
        /* Login */
        #login-screen { position: fixed; inset: 0; background: var(--char); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--smoke); border: 1px solid var(--fire); padding: 40px; border-radius: 14px; width: 350px; text-align: center; }
        
        /* Header */
        header { padding: 20px 5%; background: var(--smoke); border-bottom: 1px solid var(--fire); display: flex; justify-content: space-between; align-items: center; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px 5%; }
        .stat-card { background: var(--smoke); padding: 20px; border-radius: 10px; border-left: 4px solid var(--fire); }
        .stat-val { font-family: 'Bebas Neue'; font-size: 2.5rem; color: var(--fire); display: block; }
        
        /* Orders */
        .orders-list { padding: 0 5% 50px; }
        .order-card { background: #1A1108; border: 1px solid rgba(245,168,0,0.15); border-radius: 12px; padding: 25px; margin-bottom: 20px; border-left: 5px solid var(--fire); }
        .status-badge { font-family: 'Bebas Neue'; padding: 4px 12px; border-radius: 4px; font-size: 0.9rem; }
        .btn-action { font-family: 'Bebas Neue'; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; margin-right: 10px; transition: 0.2s; }
        .btn-start { background: var(--fire); color: var(--char); }
        .btn-ready { background: var(--success); color: white; }
        .btn-cancel { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1 style="font-family:'Playfair Display'; color:var(--fire); margin-bottom:5px;">'Ihawan</h1>
            <p style="font-family:'Bebas Neue'; color:var(--muted); margin-bottom:25px;">Owner Portal</p>
            <input type="text" id="user" placeholder="Username" style="width:100%; padding:12px; margin-bottom:10px; background:#000; border:1px solid #333; color:white;">
            <input type="password" id="pass" placeholder="Password" style="width:100%; padding:12px; margin-bottom:20px; background:#000; border:1px solid #333; color:white;">
            <button onclick="login()" style="width:100%; padding:12px; background:var(--fire); border:none; font-family:'Bebas Neue'; cursor:pointer;">SIGN IN →</button>
        </div>
    </div>

    <div id="main-dashboard" style="display:none;">
        <header>
            <div><span style="font-family:'Playfair Display'; color:var(--fire); font-size:1.5rem;">'Ihawan Dashboard</span></div>
            <div id="clock" style="font-size:0.8rem; color:var(--muted);"></div>
            <button onclick="logout()" style="background:none; border:1px solid var(--fire); color:var(--fire); padding:5px 15px; cursor:pointer; font-family:'Bebas Neue';">SIGN OUT</button>
        </header>

        <div class="stats-row">
            <div class="stat-card"><span class="stat-val" id="stat-new">0</span><small>NEW ORDERS</small></div>
            <div class="stat-card"><span class="stat-val" id="stat-prep" style="color:orange;">0</span><small>PREPARING</small></div>
            <div class="stat-card"><span class="stat-val" id="stat-rev">₱0</span><small>TODAY'S REVENUE</small></div>
        </div>

        <div class="orders-list" id="orders-container"></div>
    </div>

    <script>
        let knownIds = new Set();

        function login() {
            if(document.getElementById('user').value === 'ihawan_owner' && document.getElementById('pass').value === 'grill2026!') {
                sessionStorage.setItem('ihawan_auth', 'true');
                checkAuth();
            } else { alert("Wrong credentials"); }
        }

        function checkAuth() {
            if(sessionStorage.getItem('ihawan_auth') === 'true') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-dashboard').style.display = 'block';
                renderDashboard();
            }
        }

        function logout() { sessionStorage.clear(); location.reload(); }

        function beep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [880, 1047, 1319].forEach((f, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = f;
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(ctx.currentTime + (i * 0.15));
                osc.stop(ctx.currentTime + (i * 0.15) + 0.1);
            });
        }

        function updateStatus(id, newStatus) {
            let orders = JSON.parse(localStorage.getItem('ihawan_orders'));
            const idx = orders.findIndex(o => o.id === id);
            orders[idx].status = newStatus;
            localStorage.setItem('ihawan_orders', JSON.stringify(orders));
            renderDashboard();
        }

        function renderDashboard() {
            const orders = JSON.parse(localStorage.getItem('ihawan_orders') || '[]');
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            let newCount = 0, prepCount = 0, revenue = 0;

            orders.sort((a,b) => b.timestamp - a.timestamp).forEach(o => {
                if(o.status === 'received') newCount++;
                if(o.status === 'preparing') prepCount++;
                revenue += o.total;

                if(!knownIds.has(o.id)) {
                    if(knownIds.size > 0) beep();
                    knownIds.add(o.id);
                }

                const dateStr = new Date(o.timestamp).toLocaleTimeString();
                
                container.innerHTML += `
                    <div class="order-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                            <span style="font-family:'Bebas Neue'; color:var(--fire); font-size:1.2rem;">${o.id}</span>
                            <span class="status-badge" style="background:rgba(255,255,255,0.1)">${o.status.toUpperCase()}</span>
                            <small style="color:var(--muted)">${dateStr}</small>
                        </div>
                        <h3 style="font-family:'Playfair Display'">${o.customer.name} - ${o.customer.type.toUpperCase()}</h3>
                        <p style="font-size:0.9rem; color:var(--muted); margin:10px 0;">${o.items.map(i => i.qty+'x '+i.name).join(', ')}</p>
                        <div style="font-weight:bold; color:var(--fire); margin-bottom:15px;">Total: ₱${o.total.toFixed(2)}</div>
                        <div>
                            ${o.status === 'received' ? `<button class="btn-action btn-start" onclick="updateStatus('${o.id}', 'preparing')">🔥 START COOKING</button>` : ''}
                            ${o.status === 'preparing' ? `<button class="btn-action btn-ready" onclick="updateStatus('${o.id}', 'ready')">✅ MARK READY</button>` : ''}
                            ${o.status !== 'cancelled' && o.status !== 'completed' ? `<button class="btn-action btn-cancel" onclick="updateStatus('${o.id}', 'cancelled')">CANCEL</button>` : ''}
                        </div>
                    </div>
                `;
            });

            document.getElementById('stat-new').innerText = newCount;
            document.getElementById('stat-prep').innerText = prepCount;
            document.getElementById('stat-rev').innerText = '₱' + revenue.toFixed(0);
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleString();
            if(sessionStorage.getItem('ihawan_auth')) renderDashboard();
        }, 5000);

        checkAuth();
    </script>
</body>
</html>
