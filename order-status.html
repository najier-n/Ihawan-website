<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | 'Ihawan Filipino Grill</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --fire: #F5A800; --char: #1A1108; --smoke: #2E2416; --cream: #FDF3E3; --muted: rgba(253,243,227,0.55); --success: #22C55E; }
        body { background: var(--char); color: var(--cream); font-family: 'Lato', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: var(--smoke); border: 1px solid var(--fire); border-radius: 14px; padding: 40px; width: 100%; max-width: 500px; text-align: center; }
        .logo { color: var(--fire); font-family: 'Playfair Display'; font-size: 2rem; margin-bottom: 20px; display: block; text-decoration: none; }
        input { width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--fire); color: white; border-radius: 6px; font-family: 'Bebas Neue'; letter-spacing: 2px; font-size: 1.2rem; text-align: center; margin-bottom: 20px; }
        .btn { background: var(--fire); color: var(--char); border: none; padding: 15px; width: 100%; border-radius: 6px; font-family: 'Bebas Neue'; cursor: pointer; font-size: 1.1rem; }
        
        .tracker { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px; display: none; }
        .step { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; opacity: 0.3; transition: 0.5s; text-align: left; }
        .step.active { opacity: 1; color: var(--fire); }
        .step.done { opacity: 1; color: var(--success); }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
        
        .pulse-ready { animation: pulse 1.5s infinite; color: var(--success) !important; font-weight: bold; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="card">
        <a href="index.html" class="logo">'Ihawan</a>
        <h2 style="font-family:'Playfair Display'; margin-bottom: 10px;">Track Your Order</h2>
        <p style="color:var(--muted); font-size:0.9rem; margin-bottom:25px;">Enter your Order ID (e.g., IHW-XXXXXX)</p>
        
        <input type="text" id="order-id-input" placeholder="IHW-XXXXXX">
        <button class="btn" onclick="trackOrder()">TRACK ORDER 🔥</button>

        <div id="status-area" class="tracker">
            <h3 id="greeting" style="margin-bottom:20px;"></h3>
            <div id="step-received" class="step"><div class="dot"></div> 🧾 ORDER RECEIVED</div>
            <div id="step-preparing" class="step"><div class="dot"></div> 🔥 PREPARING</div>
            <div id="step-ready" class="step"><div class="dot"></div> ✅ READY FOR PICKUP</div>
            <div id="step-cancelled" class="step" style="display:none; color:red;"><div class="dot"></div> ❌ CANCELLED</div>
        </div>
    </div>

    <script>
        // Check URL for ID
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if(id) {
            document.getElementById('order-id-input').value = id;
            trackOrder();
        }

        function trackOrder() {
            const orderId = document.getElementById('order-id-input').value.toUpperCase();
            const orders = JSON.parse(localStorage.getItem('ihawan_orders') || '[]');
            const order = orders.find(o => o.id === orderId);

            if(!order) {
                alert("Order not found!");
                return;
            }

            document.getElementById('status-area').style.display = 'block';
            document.getElementById('greeting').innerText = `Hi ${order.customer.name}!`;
            
            // Reset steps
            ['received', 'preparing', 'ready', 'cancelled'].forEach(s => {
                document.getElementById('step-'+s).className = 'step';
            });

            if(order.status === 'cancelled') {
                document.getElementById('step-cancelled').style.display = 'flex';
                document.getElementById('step-cancelled').className = 'step active';
            } else {
                document.getElementById('step-received').className = 'step done';
                if(order.status === 'preparing') {
                    document.getElementById('step-preparing').className = 'step active';
                } else if(order.status === 'ready' || order.status === 'completed') {
                    document.getElementById('step-preparing').className = 'step done';
                    document.getElementById('step-ready').className = 'step active pulse-ready';
                }
            }
        }

        // Auto-poll
        setInterval(() => {
            if(document.getElementById('status-area').style.display === 'block') trackOrder();
        }, 4000);
    </script>
</body>
</html>
