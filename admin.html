<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN Dashboard | 'Ihawan Menu Manager</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@300;400;700&family=Playfair+Display:wght@900&display=swap');

        :root {
            --fire: #F5A800; --ember: #E05A00; --char: #0F0A05; --smoke: #1A1108;
            --cream: #FDF3E3; --muted: rgba(253,243,227,0.55); --success: #22C55E;
            --danger: #EF4444; --border: rgba(245,168,0,0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--char); color: var(--cream); font-family: 'Lato', sans-serif; min-height: 100vh; }

        /* --- LOGIN SCREEN --- */
        #loginScreen {
            position: fixed; inset: 0; background: radial-gradient(circle at center, #2E2416 0%, #0F0A05 100%);
            display: flex; align-items: center; justify-content: center; z-index: 10000;
        }
        .login-card {
            background: var(--smoke); border: 1px solid rgba(245,168,0,0.2);
            padding: 44px 40px; border-radius: 14px; width: min(420px, 92vw); text-align: center;
        }
        .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 15px; display: none; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% {transform:translateX(0)} 25% {transform:translateX(-5px)} 75% {transform:translateX(5px)} }

        /* --- DASHBOARD --- */
        #dashboard { display: none; padding: 40px 5vw; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 40px; }
        
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1E1408; border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
        .stat-num { font-family: 'Bebas Neue'; font-size: 2.5rem; line-height: 1; }
        .stat-label { font-size: 0.82rem; color: var(--muted); letter-spacing: 0.1em; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
        .search-input { width: 300px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 12px; color: white; border-radius: 6px; }

        /* --- GRID --- */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .manage-card {
            background: #1A1108; border: 1px solid var(--border); border-radius: 12px; padding: 24px;
            position: relative; border-left: 4px solid var(--muted);
        }
        .manage-card.active { border-left-color: var(--success); }
        .badge-row { display: flex; gap: 8px; margin-top: 10px; }
        .badge { font-family: 'Bebas Neue'; font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
        .m-btn {
            font-family: 'Bebas Neue'; padding: 8px; border-radius: 4px; border: 1px solid var(--border);
            background: transparent; color: var(--cream); cursor: pointer; font-size: 0.8rem;
        }
        .m-btn:hover { border-color: var(--fire); color: var(--fire); }
        .btn-del:hover { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.05); }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
            align-items: center; justify-content: center; z-index: 5000;
        }
        .modal {
            background: #1E1408; border: 1px solid var(--border); border-radius: 16px;
            width: min(560px, 95vw); padding: 40px; max-height: 90vh; overflow-y: auto;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-family: 'Bebas Neue'; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.2em; margin-bottom: 8px; }

        /* --- TOAST --- */
        #toastContainer { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast {
            background: #1E1408; border: 1px solid var(--border); border-left: 4px solid var(--fire);
            padding: 14px 20px; border-radius: 8px; margin-bottom: 10px; min-width: 250px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from{transform:translateX(100%); opacity:0} to{transform:translateX(0); opacity:1} }

        .btn-primary { background: var(--fire); color: var(--char); border: none; font-family: 'Bebas Neue'; padding: 12px 24px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-card" id="loginCard">
            <h1 style="font-family: 'Playfair Display'; color: var(--fire);">'Ihawan</h1>
            <p style="font-family: 'Bebas Neue'; letter-spacing: 0.3em; color: var(--muted);">Menu Manager</p>
            <div style="margin-top: 30px;">
                <label>USERNAME</label>
                <input type="text" id="username" class="search-input" style="width:100%" value="ihawan_admin">
                <label style="margin-top: 15px;">PASSWORD</label>
                <input type="password" id="password" class="search-input" style="width:100%" placeholder="grill2026!">
                <button class="btn-primary" style="width:100%; margin-top: 25px;" onclick="handleLogin()">SIGN IN →</button>
                <div class="error-msg" id="loginError">Invalid credentials.</div>
            </div>
        </div>
    </div>

    <div id="dashboard">
        <div class="top-bar">
            <div>
                <h2 style="font-family: 'Playfair Display'; color: var(--fire);">'Ihawan</h2>
                <p class="stat-label">ADMIN DASHBOARD</p>
            </div>
            <button class="m-btn" onclick="signOut()">SIGN OUT</button>
        </div>

        <div class="stats-row" id="statsRow">
            <!-- JS -->
        </div>

        <div class="action-bar">
            <input type="text" class="search-input" placeholder="🔍 Search menu..." oninput="renderGrid(this.value)">
            <div style="display:flex; gap:10px;">
                <button class="m-btn" onclick="resetMenu()">↺ RESET ALL</button>
                <button class="btn-primary" onclick="openModal()">+ ADD NEW ITEM</button>
            </div>
        </div>

        <div class="menu-grid" id="menuGrid">
            <!-- JS -->
        </div>

        <div style="text-align:center; margin-top: 60px; padding: 20px; border: 1px solid var(--border); border-radius: 10px;">
            <p style="color: var(--muted);">🟢 Changes are live. Customers see updates in 3 seconds.</p>
            <a href="index.html" target="_blank" style="color: var(--fire); text-decoration: none; font-family: 'Bebas Neue';">Preview Customer Site →</a>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle" style="font-family:'Playfair Display'; margin-bottom: 25px;">Add Item</h2>
            <form id="menuForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>ITEM NAME</label>
                    <input type="text" id="m_name" class="search-input" style="width:100%" required>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div class="form-group">
                        <label>CATEGORY</label>
                        <select id="m_cat" class="search-input" style="width:100%">
                            <option value="grill">Grill Specials</option>
                            <option value="Rice Meals">Rice Meals</option>
                            <option value="Soups & Sides">Soups & Sides</option>
                            <option value="Drinks">Drinks</option>
                            <option value="Desserts">Desserts</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>PRICE ($)</label>
                        <input type="number" id="m_price" step="0.01" class="search-input" style="width:100%" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>EMOJI</label>
                    <input type="text" id="m_emoji" class="search-input" style="width:40px; text-align:center;" maxlength="2" required>
                </div>
                <div class="form-group">
                    <label>DESCRIPTION</label>
                    <textarea id="m_desc" class="search-input" style="width:100%; height:80px;"></textarea>
                </div>
                <div style="display:flex; gap:20px; margin-bottom: 30px;">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                        <input type="checkbox" id="m_best"> Mark Bestseller
                    </label>
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                        <input type="checkbox" id="m_avail" checked> Available
                    </label>
                </div>
                <div style="display:flex; gap:10px; justify-content: flex-end;">
                    <button type="button" class="m-btn" onclick="closeModal()">CANCEL</button>
                    <button type="submit" class="btn-primary">SAVE CHANGES</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        const DEFAULT_MENU = [  
        { id: 1, cat: 'Grill Specials', name: 'Chicken BBQ Skewers', price: 19, desc: 'Overnight marinated in soy, calamansi & banana ketchup. Charcoal-grilled.', emoji: '🍢', best: true },  
        { id: 2, cat: 'Grill Specials', name: 'Inihaw na Manok', price: 59, desc: 'Butterflied whole chicken basted with lemongrass butter. Perfectly charred.', emoji: '🍗' },  
        { id: 3, cat: 'Grill Specials', name: 'Beef sa Grill', price: 299, desc: 'Thick-cut beef belly, slow-grilled with garlic vinegar glaze.', emoji: '🥩' },  
        { id: 4, cat: 'Grill Specials', name: 'Isaw (Grilled Intestine)', price: 12, desc: 'Classic Filipino street skewer, seasoned and char-grilled.', emoji: '🍢' },  
        { id: 5, cat: 'Grill Specials', name: 'Grilled Fish', price: 89, desc: 'Stuffed milkfish with tomato, onion & ginger. Wrapped in foil.', emoji: '🐟' },  
        { id: 6, cat: 'Rice Meals', name: 'Sinangag', price: 79, desc: 'Wok-fried day-old rice tossed in roasted garlic and butter.', emoji: '🍚' },  
        { id: 7, cat: 'Rice Meals', name: 'BBQ Combo Rice Box', price: 129, desc: '2 chicken skewers, garlic rice, pickled papaya & egg.', emoji: '🍱', best: true },  
        { id: 8, cat: 'Rice Meals', name: 'Tapsilog', price: 69, desc: 'Beef tapa, sinangag, and sunny-side-up egg.', emoji: '🍳' },  
        { id: 9, cat: 'Soups & Sides', name: 'Sinigang na Manok', price: 89, desc: 'Sour tamarind pork soup with radish, kangkong & eggplant.', emoji: '🍲' },  
        { id: 10, cat: 'Soups & Sides', name: 'Kare-Kare', price: 89, desc: 'Oxtail stew in rich peanut sauce, served with bagoong.', emoji: '🥜' },  
        { id: 11, cat: 'Soups & Sides', name: 'Achara', price: 39, desc: 'Classic sweet-sour pickled papaya condiment.', emoji: '🥗' },  
        { id: 12, cat: 'Drinks', name: 'Calamansi Juice', price: 19, desc: 'Fresh-squeezed Filipino lime, lightly sweetened.', emoji: '🥤' },  
        { id: 13, cat: 'Drinks', name: 'Sago\'t Gulaman', price: 19, desc: 'Brown sugar drink with tapioca pearls and jelly.', emoji: '🍹' },  
        { id: 14, cat: 'Drinks', name: 'San Miguel Beer', price: 79, desc: 'Ice-cold Filipino lager.', emoji: '🍺', best: true },  
        { id: 15, cat: 'Desserts', name: 'Halo-Halo', price: 29, desc: 'Shaved ice, mixed sweets, ube ice cream & leche flan.', emoji: '🧊' },  
        { id: 16, cat: 'Desserts', name: 'Leche Flan', price: 109, desc: 'Silky caramel egg custard. Dense, rich, golden.', emoji: '🍮' },  
        { id: 17, cat: 'Desserts', name: 'Turon', price: 12, desc: 'Banana & jackfruit spring rolls, fried golden.', emoji: '🍌' }, 
        { id: 101, cat: 'Hidden', name: 'Chicken BBQ Skewers Set 1', price: 89, desc: '2 Skewers + Garlic Rice', emoji: '🍢' },
        { id: 102, cat: 'Hidden', name: 'Chicken BBQ Skewers Set 2', price: 149, desc: '4 Skewers + Garlic Rice + Drink', emoji: '🍢' },
        { id: 201, cat: 'Hidden', name: 'Isaw Set 1', price: 49, desc: '3 Sticks + Vinegar Dip', emoji: '🔥' },
        { id: 202, cat: 'Hidden', name: 'Isaw Set 2', price: 99, desc: '6 Sticks + Garlic Rice + Drink', emoji: '🔥' }
    ];  

        function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === 'ihawan_admin' && p === 'grill2026!') {
                sessionStorage.setItem('ihawan_auth', 'true');
                checkAuth();
            } else {
                const card = document.getElementById('loginCard');
                card.classList.add('shake');
                document.getElementById('loginError').style.display = 'block';
                setTimeout(() => card.classList.remove('shake'), 400);
            }
        }

        function checkAuth() {
            if(sessionStorage.getItem('ihawan_auth') === 'true') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderGrid();
            }
        }

        function signOut() {
            sessionStorage.removeItem('ihawan_auth');
            location.reload();
        }

        function getMenu() {
            return JSON.parse(localStorage.getItem('ihawan_menu') || JSON.stringify(DEFAULT_MENU));
        }

        function saveMenu(arr) {
            localStorage.setItem('ihawan_menu', JSON.stringify(arr));
            renderGrid();
        }

        function renderGrid(query = '') {
            const menu = getMenu();
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            
            const filtered = menu.filter(i => i.name.toLowerCase().includes(query.toLowerCase()));
            
            // Update Stats
            document.getElementById('statsRow').innerHTML = `
                <div class="stat-card"><div class="stat-num">${menu.length}</div><div class="stat-label">TOTAL ITEMS</div></div>
                <div class="stat-card"><div class="stat-num" style="color:var(--success)">${menu.filter(i=>i.available).length}</div><div class="stat-label">LIVE</div></div>
                <div class="stat-card"><div class="stat-num" style="color:var(--danger)">${menu.filter(i=>!i.available).length}</div><div class="stat-label">HIDDEN</div></div>
                <div class="stat-card"><div class="stat-num" style="color:var(--fire)">${menu.filter(i=>i.best).length}</div><div class="stat-label">BESTSELLERS</div></div>
            `;

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `manage-card ${item.available ? 'active' : ''}`;
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <span style="font-size:1.5rem">${item.emoji}</span>
                        <span style="font-family:'Bebas Neue'; font-size:0.6rem; color:var(--muted)">${item.id}</span>
                    </div>
                    <div style="font-family:'Playfair Display'; font-size:1.1rem; margin-top:10px;">${item.name}</div>
                    <div style="font-size:0.8rem; color:var(--muted); height:40px; overflow:hidden;">${item.desc}</div>
                    <div style="font-family:'Bebas Neue'; color:var(--fire); font-size:1.2rem; margin:10px 0;">$${item.price.toFixed(2)}</div>
                    <div class="badge-row">
                        <span class="badge" style="background:rgba(245,168,0,0.1); color:var(--fire)">${item.cat.toUpperCase()}</span>
                        ${item.best ? '<span class="badge" style="background:var(--fire); color:var(--char)">BESTSELLER</span>' : ''}
                        ${!item.available ? '<span class="badge" style="background:var(--danger); color:white">HIDDEN</span>' : ''}
                    </div>
                    <div class="btn-grid">
                        <button class="m-btn" onclick="openModal('${item.id}')">EDIT</button>
                        <button class="m-btn" onclick="toggleStatus('${item.id}', 'available')">${item.available ? 'HIDE' : 'SHOW'}</button>
                        <button class="m-btn" onclick="toggleStatus('${item.id}', 'best')">BESTSELLER</button>
                        <button class="m-btn btn-del" onclick="deleteItem('${item.id}')">DELETE</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleStatus(id, key) {
            const menu = getMenu();
            const idx = menu.findIndex(i => i.id == id);
            menu[idx][key] = !menu[idx][key];
            saveMenu(menu);
            showToast(`${menu[idx].name} updated.`);
        }

        function deleteItem(id) {
            if(confirm('Are you sure you want to delete this item?')) {
                const menu = getMenu().filter(i => i.id !== id);
                saveMenu(menu);
                showToast('Item removed from menu.', 'danger');
            }
        }

        function resetMenu() {
            if(confirm('Restore default menu items? This wipes your changes.')) {
                saveMenu(DEFAULT_MENU);
                showToast('Menu reset to defaults.');
            }
        }

        function openModal(id = null) {
            const overlay = document.getElementById('modalOverlay');
            const form = document.getElementById('menuForm');
            form.reset();
            document.getElementById('editId').value = id || '';
            document.getElementById('modalTitle').innerText = id ? 'Edit Menu Item' : 'Add New Item';

            if(id) {
                const item = getMenu().find(i => i.id == id);
                document.getElementById('m_name').value = item.name;
                document.getElementById('m_cat').value = item.cat;
                document.getElementById('m_price').value = item.price;
                document.getElementById('m_emoji').value = item.emoji;
                document.getElementById('m_desc').value = item.desc;
                document.getElementById('m_best').checked = item.best;
                document.getElementById('m_avail').checked = item.available;
            }
            overlay.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        document.getElementById('menuForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const menu = getMenu();
            
            const itemData = {
    id: id || Date.now(),
    cat: document.getElementById('m_cat').value,
    name: document.getElementById('m_name').value,
    price: parseFloat(document.getElementById('m_price').value),
    desc: document.getElementById('m_desc').value,
    emoji: document.getElementById('m_emoji').value,
    best: document.getElementById('m_best').checked,
    available: document.getElementById('m_avail').checked
};

            if(id) {
                const idx = menu.findIndex(i => i.id == id);
                menu[idx] = itemData;
            } else {
                menu.push(itemData);
            }

            saveMenu(menu);
            closeModal();
            showToast(id ? 'Item updated!' : 'New item added!');
        };

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            if(type === 'danger') t.style.borderLeftColor = 'var(--danger)';
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        checkAuth();
    </script>
</body>
</html>
